[project]
name = "researchpilot"
version = "0.1.0"
description = "ResearchPilot: Agentic AI Research and Literature Review Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "alembic>=1.13.3",
    "pymupdf>=1.24.11",
    "tiktoken>=0.8.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "openai>=1.52.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B008", "BLE001", "G201", "TRY401", "S110", "ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
